[project]
name = "edu1"
version = "0.1.0"
description = "EML to Markdown, Text Normalizer, and Ollama Tool Playground"
readme = "README.md"
authors = [
    { email = "secufather@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.151.0",
    "httpx>=0.28.1",
    "markitdown-email-plugin>=0.1.1",
    "markitdown[all]>=0.1.8",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "unidecode>=1.4.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
